<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="HYDRA v{{ version }} by {{ handle }}">
  <meta name="author" content="MrInvenix {{ handle }}">
  <title>HYDRA · {{ handle }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Generated by HYDRA v{{ version }} | {{ handle }} | {{ channel }} -->

<header class="topbar">
  <div class="brand">
    <span class="logo">⚡</span>
    <span class="name">HYDRA</span>
    <span class="ver">v{{ version }}</span>
  </div>
  <div class="meta">
    <a href="{{ channel }}" target="_blank" rel="noopener">{{ handle }}</a>
  </div>
</header>

<main class="wrap">

  <section class="panel">
    <label class="lbl" for="target">target</label>
    <div class="row">
      <input id="target" type="text" placeholder="username / email / phone / ФИО / domain"
             autocomplete="off" spellcheck="false" autofocus>
      <button id="scan-btn" class="btn primary">Scan</button>
    </div>

    <div class="row options">
      <div class="opt">
        <label class="lbl">mode</label>
        <div class="segmented" id="mode">
          <button data-val="passive" class="active">passive</button>
          <button data-val="active">active</button>
        </div>
      </div>

      <div class="opt">
        <label class="lbl">sources</label>
        <label class="check">
          <input type="checkbox" id="use-wmn" checked>
          <span>WMN (200+)</span>
        </label>
      </div>

      <div class="opt">
        <label class="lbl">concurrency</label>
        <input id="concurrency" type="number" value="25" min="1" max="200">
      </div>
    </div>
  </section>

  <section class="panel progress-panel" id="progress-panel" hidden>
    <div class="progress-head">
      <span id="progress-label">starting…</span>
      <span id="progress-count">0 / 0</span>
    </div>
    <div class="bar"><div class="fill" id="progress-fill"></div></div>
    <div class="log" id="log"></div>
  </section>

  <section class="panel results-panel" id="results-panel" hidden>
    <div class="results-head">
      <h2>hits <span id="hit-count">0</span></h2>
    </div>
    <table class="results" id="results">
      <thead>
        <tr>
          <th>source</th><th>target</th><th>conf</th>
          <th>status</th><th>evidence</th><th>url</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

</main>

<footer class="footer">
  <span>HYDRA v{{ version }}</span>
  <span class="dot">·</span>
  <span>{{ handle }}</span>
  <span class="dot">·</span>
  <a href="{{ channel }}" target="_blank" rel="noopener">{{ channel }}</a>
  <span class="dot">·</span>
  <span>MIT</span>
</footer>

<!-- signature=hydra::v5::MrInvenix::2026 -->

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const targetEl = $("#target");
  const btn = $("#scan-btn");
  const progPanel = $("#progress-panel");
  const progFill = $("#progress-fill");
  const progLabel = $("#progress-label");
  const progCount = $("#progress-count");
  const log = $("#log");
  const resultsPanel = $("#results-panel");
  const resultsBody = $("#results tbody");
  const hitCount = $("#hit-count");

  // segmented mode
  let mode = "passive";
  document.querySelectorAll("#mode button").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll("#mode button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      mode = b.dataset.val;
    });
  });

  function pushLog(text, cls = "") {
    const line = document.createElement("div");
    line.className = "line " + cls;
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    while (log.children.length > 500) log.removeChild(log.firstChild);
  }

  function addHit(h) {
    const tr = document.createElement("tr");
    const conf = (h.confidence || "n/a").toLowerCase();
    tr.innerHTML = `
      <td class="src">${h.source}</td>
      <td class="tgt">${h.target}</td>
      <td><span class="badge ${conf}">${h.confidence || "n/a"}</span></td>
      <td class="st">${h.status ?? ""}</td>
      <td class="ev">${(h.evidence || "").replace(/</g,"&lt;")}</td>
      <td class="url">${h.url
        ? `<a href="${h.url}" target="_blank" rel="noopener">${h.url.slice(0,60)}…</a>`
        : ""}</td>`;
    resultsBody.appendChild(tr);
  }

  async function scan() {
    const target = targetEl.value.trim();
    if (!target) { targetEl.focus(); return; }

    btn.disabled = true;
    btn.textContent = "scanning…";
    log.innerHTML = "";
    resultsBody.innerHTML = "";
    hitCount.textContent = "0";
    progPanel.hidden = false;
    resultsPanel.hidden = false;
    progFill.style.width = "0%";
    progLabel.textContent = "starting…";
    progCount.textContent = "0 / 0";

    let jobId;
    try {
      const r = await fetch("/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          target, mode,
          use_wmn: $("#use-wmn").checked,
          concurrency: parseInt($("#concurrency").value, 10) || 25,
        }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "scan failed");
      jobId = data.job_id;
    } catch (e) {
      pushLog("error: " + e.message, "err");
      btn.disabled = false;
      btn.textContent = "Scan";
      return;
    }

    const es = new EventSource(`/events/${jobId}`);
    let hits = 0;

    es.onmessage = (m) => {
      const ev = JSON.parse(m.data);
      if (ev.type === "start") {
        progLabel.textContent = `scanning ${ev.total} sources…`;
        progCount.textContent = `0 / ${ev.total}`;
      } else if (ev.type === "progress") {
        const pct = ev.total ? (ev.done / ev.total) * 100 : 0;
        progFill.style.width = pct.toFixed(1) + "%";
        progCount.textContent = `${ev.done} / ${ev.total}`;
        const cls = ev.found ? "hit" : (ev.status ? "miss" : "dim");
        pushLog(
          `${String(ev.source).padEnd(20)} status=${ev.status ?? "-"} ${ev.elapsed_ms ?? 0}ms`,
          cls
        );
      } else if (ev.type === "done") {
        hits = ev.total_hits;
        hitCount.textContent = String(hits);
        (ev.hits || []).forEach(addHit);
        pushLog(`─ done · ${hits} hits / ${ev.total_checks} checks`, "done");
        progLabel.textContent = "done";
        progFill.style.width = "100%";
      } else if (ev.type === "error") {
        pushLog("error: " + ev.message, "err");
      } else if (ev.type === "close") {
        es.close();
        btn.disabled = false;
        btn.textContent = "Scan";
      }
    };

    es.onerror = () => {
      es.close();
      btn.disabled = false;
      btn.textContent = "Scan";
    };
  }

  btn.addEventListener("click", scan);
  targetEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") scan();
  });
})();
</script>
</body>
  </html>
