[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-osint"
version = "5.0.0"
description = "HYDRA — multi-source OSINT core. many heads, one target."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MrInvenix", email = "MrInvenix@users.noreply.github.com" }]
keywords = ["osint", "recon", "username", "email", "phone", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
    "aiosqlite>=0.19",
    "phonenumbers>=8.13",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.43"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
]

[project.scripts]
hydra = "hydra:main"

[project.urls]
Homepage = "https://github.com/MrInvenix/hydra"
Repository = "https://github.com/MrInvenix/hydra"
Channel = "https://t.me/info_by_invenix"
Issues = "https://github.com/MrInvenix/hydra/issues"

[tool.setuptools]
py-modules = ["hydra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"